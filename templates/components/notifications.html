<!-- Componente de notificaciones del usuario (base de datos) -->
{% if user.is_authenticated %}
<div id="notifications-container" class="fixed top-24 right-4 z-50 flex flex-col gap-3 max-w-sm">
    {# Las notificaciones se inyectarán aquí por JavaScript #}
</div>

<script>
    function loadNotifications() {
        fetch('/api/notificaciones')
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById('notifications-container');
                container.innerHTML = '';
                
                data.notificaciones.forEach(notif => {
                    const div = document.createElement('div');
                    
                    let bgClass = 'bg-blue-950/90 border-blue-500/50 text-blue-400';
                    if (notif.tipo === 'success') bgClass = 'bg-emerald-950/90 border-emerald-500/50 text-emerald-400';
                    if (notif.tipo === 'error') bgClass = 'bg-red-950/90 border-red-500/50 text-red-400';
                    if (notif.tipo === 'warning') bgClass = 'bg-amber-950/90 border-amber-500/50 text-amber-400';
                    
                    div.className = `rounded-2xl border ${bgClass} px-5 py-3 text-sm shadow-lg backdrop-blur-md animate-slide-in flex items-start justify-between gap-4`;
                    div.innerHTML = `
                        <span>${notif.mensaje}</span>
                        <button onclick="deleteNotification(${notif.id})" class="text-lg font-bold opacity-60 hover:opacity-100 flex-shrink-0">×</button>
                    `;
                    
                    container.appendChild(div);
                    
                    setTimeout(() => {
                        div.remove();
                    }, 5000);
                });
            });
    }
    
    function deleteNotification(id) {
        fetch(`/api/notificaciones/${id}`, { method: 'DELETE' })
            .then(() => loadNotifications());
    }
    
    loadNotifications();
    setInterval(loadNotifications, 5000);
</script>

<style>
    @keyframes slide-in {
        from {
            opacity: 0;
            transform: translateX(400px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    .animate-slide-in {
        animation: slide-in 0.3s ease-out;
    }
</style>
{% endif %}
