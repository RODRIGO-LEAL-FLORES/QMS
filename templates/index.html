
{% extends "base.html" %}
{% block title %}Inicio - VC Laminations{% endblock %}

{% block content %}
<style>
    .inicio-contenedor {
        position: relative;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        min-height: calc(100vh - 6rem);
        margin: -3rem 0;
        transform: translateX(-50%);
        padding: 30px 20px;
        overflow: hidden;
        background-image: url('/static/VCLAMINATIONS1.jpg');
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
    }
    .inicio-contenido {
        display: grid;
        grid-template-columns: 50% 50%;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 1600px;
    }
    .inicio-texto {
        position: relative;
        z-index: 2;
        text-align: center;
    }
    .inicio-subtitulo {
        margin-bottom: 10px;
        color: #334155;
        font-size: .75rem;
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
    }
    .inicio-titulo {
        margin: 0;
        font-size: 1.25rem !important;
        font-weight: 700;
        line-height: 1.1 !important;
        letter-spacing: 0;
        text-transform: uppercase;
        background: linear-gradient(110deg, #020617 0%, #020617 45%, #475569 75%, #94a3b8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(1px 2px 2px rgba(0,0,0,.25));
    }
    .inicio-titulo span {
        display: block;
        line-height: 1 !important;
        white-space: nowrap;
        background: transparent !important;
        box-shadow: none !important;
    }
    @media (max-width: 900px) {
        .inicio-contenido {
            grid-template-columns: 1fr;
        }
        .inicio-contenedor {
            padding: 35px 15px;
        }
        .inicio-titulo {
            font-size: 1.25rem !important;
        }
    }
    @media (max-width: 640px) {
        .inicio-contenedor {
            padding: 25px 10px;
        }
        .inicio-subtitulo {
            font-size: 10px;
            letter-spacing: .1em;
        }
        .inicio-titulo {
            font-size: 1.25rem !important;
            letter-spacing: 0;
        }
        .inicio-contenido {
            padding-left: 0;
        }
        .inicio-texto {
            text-align: center;
        }
    }
</style>
<section class="inicio-contenedor">
    <div class="inicio-contenido">
        <div class="inicio-texto">
            <p class="inicio-subtitulo">VC LAMINATIONS — LAPHAM-HICKEY STEEL</p>
            <h1 class="inicio-titulo">
                <span>QUALITY</span>
                <span>MANAGEMENT</span>
                <span>SYSTEM</span>
            </h1>
        </div>
    </div>
</section>
{% endblock %}
