{% extends "base.html" %}

{% block title %}Inicio - VC Laminations{% endblock %}

{% block content %}

<div class="flex items-center justify-center min-h-[calc(100vh-14rem)] py-12">

    <div class="text-center max-w-3xl mx-auto px-4">

        <p class="text-xs font-black tracking-widest text-slate-700 uppercase mb-4">
            VC LAMINATIONS — LAPHAM-HICKEY STEEL
        </p>

        <h1
            class="text-4xl sm:text-5xl md:text-6xl font-black tracking-widest uppercase leading-tight mb-6"
            style="
                background: linear-gradient(
                    to right,
                    #020617 0%,
                    #020617 38%,
                    #e2e8f0 58%,
                    #ffffff 72%,
                    #ffffff 100%
                );

                -webkit-background-clip: text;
                background-clip: text;

                -webkit-text-fill-color: transparent;
                color: transparent;

                filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.55));
            "
        >
            QUALITY
            <br>
            MANAGEMENT
            <br>
            SYSTEM
        </h1>

    </div>

</div>

{% endblock %}
